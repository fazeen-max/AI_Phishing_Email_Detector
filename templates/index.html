<!DOCTYPE html>
<html>
<head>
    <title>AI Phishing Email Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
 <div class="container">

    <h1>AI Phishing Email Detector</h1>
<form method="POST">
    <label>Sender Email:</label><br>
    <input type="text" name="sender" required><br><br>

    <label>Email Subject:</label><br>
    <input type="text" name="subject" required><br><br>

    <label>Email Content:</label><br>
    <textarea name="email" rows="8" cols="50" required></textarea><br><br>

    <button type="submit">Analyze Email</button>

</form>
 </div>   
</body>
</html>
